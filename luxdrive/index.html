<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXEDRIVE Car Rental</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts: Inter and Figtree -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Figtree', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0F0F0F'
                    }
                }
            }
        }
    </script>
    <style>
        .hero-bg {
            /* Using a dark theme placeholder image mimicking the car rental theme */
            background-image: url('https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?auto=format&fit=crop&q=80&w=2069');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-white text-dark font-sans antialiased overflow-x-hidden">
    <!-- Hero Section -->
    <section class="relative w-full h-[768px] hero-bg flex flex-col">
        <!-- Dark Overlay mimicking Figma's Rectangle 80 & Image Blend Mode -->
        <div class="absolute inset-0 bg-dark/70 mix-blend-multiply pointer-events-none"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-dark/60 to-transparent pointer-events-none"></div>

        <!-- Navigation -->
        <nav class="relative z-10 w-full max-w-[1440px] mx-auto px-10 py-8 flex justify-between items-center">
            <!-- Logo area (Heading VECTOR from Figma) -->
            <a href="#" class="font-heading font-bold text-2xl tracking-widest text-white">
                LUXEDRIVE
            </a>

            <div class="flex items-center gap-6">
                <!-- Login / Register Button (Frame 2) -->
                <a href="#" class="flex items-center gap-2 px-5 py-2 rounded-full border border-white/50 bg-white/5 backdrop-blur-[36px] hover:bg-white/10 transition text-white">
                    <span class="text-base font-semibold leading-6">Login / Register</span>
                </a>

                <!-- Hamburger Menu (Frame 3) -->
                <button class="flex flex-col gap-1.5 p-2">
                    <span class="block w-6 h-0.5 bg-white"></span>
                    <span class="block w-6 h-0.5 bg-white"></span>
                </button>
            </div>
        </nav>

        <!-- Main Hero Content -->
        <div class="relative z-10 flex-1 flex flex-col items-center justify-center pb-32 px-4">
            <h1 class="font-heading font-bold text-[48px] md:text-[64px] leading-[1.2] text-center max-w-[982px] text-white">
                Discover the world on wheels with our car rental service
            </h1>
        </div>
        
        <!-- Search Form Module (Positioned on the bottom border) -->
        <div class="absolute bottom-0 translate-y-1/2 left-0 w-full px-4 flex justify-center z-20">
            <div class="w-full max-w-[1216px] bg-white/90 backdrop-blur-[28px] rounded-2xl shadow-[0_8px_8px_-4px_rgba(16,24,40,0.03),0_24px_24px_-4px_rgba(16,24,40,0.08)] px-6 py-[30px] flex flex-col xl:flex-row items-end justify-between gap-4">
                
                <!-- Inputs Container -->
                <div class="flex-1 w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    
                    <!-- Pick-up Location -->
                    <div class="flex flex-col gap-2.5">
                        <label class="text-black font-heading text-base font-normal">Pick-up Location</label>
                        <div class="flex items-center gap-2 bg-white rounded-lg px-4 py-4 h-[53px]">
                            <!-- Location Icon -->
                            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.242-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            <input type="text" placeholder="Search a location" class="w-full bg-transparent text-black placeholder-gray-500 outline-none font-heading text-base font-normal">
                        </div>
                    </div>

                    <!-- Pick-up date -->
                    <div class="flex flex-col gap-2.5">
                        <label class="text-black font-heading text-base font-normal">Pick-up date</label>
                        <div class="flex items-center justify-between gap-2 bg-white rounded-lg px-4 py-4 h-[53px]">
                            <input type="text" placeholder="12/12/2023" class="w-full bg-transparent text-black placeholder-gray-500 outline-none font-heading text-base font-normal">
                            <!-- Calendar Icon -->
                            <svg class="w-5 h-5 text-gray-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        </div>
                    </div>

                    <!-- Drop-off Location -->
                    <div class="flex flex-col gap-2.5">
                        <label class="text-black font-heading text-base font-normal">Drop-off Location</label>
                        <div class="flex items-center gap-2 bg-white rounded-lg px-4 py-4 h-[53px]">
                            <!-- Location Icon -->
                            <svg class="w-5 h-5 text-gray-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.242-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            <input type="text" placeholder="Search a location" class="w-full bg-transparent text-black placeholder-gray-500 outline-none font-heading text-base font-normal">
                        </div>
                    </div>

                    <!-- Drop-off date -->
                    <div class="flex flex-col gap-2.5">
                        <label class="text-black font-heading text-base font-normal">Drop-off date</label>
                        <div class="flex items-center justify-between gap-2 bg-white rounded-lg px-4 py-4 h-[53px]">
                            <input type="text" placeholder="12/12/2023" class="w-full bg-transparent text-black placeholder-gray-500 outline-none font-heading text-base font-normal">
                            <!-- Calendar Icon -->
                            <svg class="w-5 h-5 text-gray-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        </div>
                    </div>

                </div>

                <!-- Submit Button -->
                <button class="w-full xl:w-auto h-[53px] px-6 py-4 flex items-center justify-center gap-2 bg-dark text-white rounded-full hover:bg-black transition-colors whitespace-nowrap mt-4 xl:mt-0">
                    <span class="font-heading font-bold text-base">Find a Vehicle</span>
                    <!-- Right Arrow Icon -->
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>

            </div>
        </div>
    </section>

    <!-- Spacer to account for the overlapping absolute positioned search module -->
    <div class="h-32 md:h-24"></div>

    <!-- Rent by Brands Section -->
    <section class="w-full max-w-[1216px] mx-auto px-4 mt-12 mb-16">
        <div class="flex justify-between items-center mb-8">
            <h2 class="font-heading font-bold text-[24px] text-black">Rent by Brands</h2>
            <a href="#" class="flex items-center gap-2 text-base font-semibold text-black hover:text-gray-600 transition-colors">
                View all
                <!-- Right Arrow Icon -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </a>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5">
            <!-- Generating 12 Brand Cards (Groups 71-82 from Figma) -->
            <!-- Note: Using placeholder text since logos are vectors in Figma -->
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex items-center justify-center hover:bg-dark/10 transition-colors"><span class="font-heading font-bold text-gray-500/50">Audi</span></a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex items-center justify-center hover:bg-dark/10 transition-colors"><span class="font-heading font-bold text-gray-500/50">BMW</span></a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex items-center justify-center hover:bg-dark/10 transition-colors"><span class="font-heading font-bold text-gray-500/50">Mercedes</span></a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex items-center justify-center hover:bg-dark/10 transition-colors"><span class="font-heading font-bold text-gray-500/50">Porsche</span></a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex items-center justify-center hover:bg-dark/10 transition-colors"><span class="font-heading font-bold text-gray-500/50">Lexus</span></a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex items-center justify-center hover:bg-dark/10 transition-colors"><span class="font-heading font-bold text-gray-500/50">Tesla</span></a>
            
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex items-center justify-center hover:bg-dark/10 transition-colors"><span class="font-heading font-bold text-gray-500/50">Ferrari</span></a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex items-center justify-center hover:bg-dark/10 transition-colors"><span class="font-heading font-bold text-gray-500/50">Lamborghini</span></a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex items-center justify-center hover:bg-dark/10 transition-colors"><span class="font-heading font-bold text-gray-500/50">Bentley</span></a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex items-center justify-center hover:bg-dark/10 transition-colors"><span class="font-heading font-bold text-gray-500/50">Aston Martin</span></a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex items-center justify-center hover:bg-dark/10 transition-colors"><span class="font-heading font-bold text-gray-500/50">Maserati</span></a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex items-center justify-center hover:bg-dark/10 transition-colors"><span class="font-heading font-bold text-gray-500/50">Land Rover</span></a>
        </div>
    </section>

    <!-- Rent by body type Section -->
    <section class="w-full max-w-[1216px] mx-auto px-4 mt-20 mb-24">
        <div class="flex justify-between items-center mb-8">
            <h2 class="font-heading font-bold text-[24px] text-black">Rent by body type</h2>
            <a href="#" class="flex items-center gap-2 text-base font-semibold text-black hover:text-gray-600 transition-colors">
                View all
                <!-- Right Arrow Icon -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </a>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5">
            <!-- Generating 6 Body Type Cards -->
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex flex-col items-center justify-center gap-3 hover:bg-dark/10 transition-colors group">
                <svg class="w-10 h-10 text-dark opacity-70 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7h8M5 11h14l1.5 5H3.5L5 11zM4 16v3a1 1 0 001 1h2a1 1 0 001-1v-3m8 0v3a1 1 0 001 1h2a1 1 0 001-1v-3"></path></svg>
                <span class="font-heading font-medium text-base text-black">SUV</span>
            </a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex flex-col items-center justify-center gap-3 hover:bg-dark/10 transition-colors group">
                <svg class="w-10 h-10 text-dark opacity-70 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0zM3 13h18l-3-6H6l-3 6z"></path></svg>
                <span class="font-heading font-medium text-base text-black">Sedan</span>
            </a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex flex-col items-center justify-center gap-3 hover:bg-dark/10 transition-colors group">
                <svg class="w-10 h-10 text-dark opacity-70 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <span class="font-heading font-medium text-base text-black">Electric</span>
            </a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex flex-col items-center justify-center gap-3 hover:bg-dark/10 transition-colors group">
                <svg class="w-10 h-10 text-dark opacity-70 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12h18M3 16h18M5 8h14"></path></svg>
                <span class="font-heading font-medium text-base text-black">Coupe</span>
            </a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex flex-col items-center justify-center gap-3 hover:bg-dark/10 transition-colors group">
                <svg class="w-10 h-10 text-dark opacity-70 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                <span class="font-heading font-medium text-base text-black">Convertible</span>
            </a>
            <a href="#" class="w-full h-[120px] bg-dark/5 rounded-lg flex flex-col items-center justify-center gap-3 hover:bg-dark/10 transition-colors group">
                <svg class="w-10 h-10 text-dark opacity-70 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>
                <span class="font-heading font-medium text-base text-black">Van</span>
            </a>
        </div>
    </section>

</body>
</html>
